[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sim-anything"
version = "0.4.0"
description = "Reverse-engineer a robot arm into a verified MuJoCo simulation from public information."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
  "mujoco==3.3.0",
  "numpy>=1.26",
  "pydantic>=2.6,<3",
  "pyyaml>=6",
  "typer>=0.12",
  "jinja2>=3.1",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
mcp = ["mcp>=2"]
rl = ["gymnasium>=1"]
mesh = ["trimesh>=4", "pycollada>=0.7", "coacd>=1"]

[project.scripts]
sim-anything = "simanything.cli:main"

[tool.setuptools.packages.find]
include = ["simanything*"]

[tool.setuptools.package-data]
simanything = ["templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "menagerie: needs third_party/mujoco_menagerie (skipped when absent)",
  "slow: slower integration tests",
]
