name: vx300s
manufacturer: Trossen Robotics (Interbotix)
model: ViperX 300 S (ViperX-300 6DOF), arm only, no gripper
dof: 6
units: {length: m, angle: deg}   # PoE table values are metres (unit not printed, consistent with m); joint limits in deg
convention: offset               # converted exactly from the manufacturer's space-frame PoE (M, Slist)
base:
  link:
    geometry:
      - {shape: cylinder, radius: 0.04225, fromto: [0, 0, 0, 0, 0, 0.04]}
joints:
  # origin.xyz = p_i - p_{i-1}, p_i = w_i x v_i from Slist row i; all frames parallel to base (rpy 0)
  - name: waist
    origin: {xyz: [0, 0, 0], rpy: [0, 0, 0]}
    axis: [0, 0, 1]
    limits: {lower: -180, upper: 180}
    link: {geometry: [{shape: cylinder, radius: 0.04225}]}
  - name: shoulder
    origin: {xyz: [0, 0, 0.12705], rpy: [0, 0, 0]}
    axis: [0, 1, 0]
    limits: {lower: -101, upper: 101}
    link: {geometry: [{shape: capsule, radius: 0.025}]}
  - name: elbow
    origin: {xyz: [0.05955, 0, 0.3], rpy: [0, 0, 0]}
    axis: [0, 1, 0]
    limits: {lower: -101, upper: 92}
    link: {geometry: [{shape: sphere, radius: 0.03, pos: [0, 0, 0]}]}
  - name: forearm_roll
    origin: {xyz: [0, 0, 0], rpy: [0, 0, 0]}
    axis: [1, 0, 0]
    limits: {lower: -180, upper: 180}
    link: {geometry: [{shape: capsule, radius: 0.025}]}
  - name: wrist_angle
    origin: {xyz: [0.3, 0, 0], rpy: [0, 0, 0]}
    axis: [0, 1, 0]
    limits: {lower: -107, upper: 130}
    link: {geometry: [{shape: sphere, radius: 0.025, pos: [0, 0, 0]}]}
  - name: wrist_rotate
    origin: {xyz: [0, 0, 0], rpy: [0, 0, 0]}
    axis: [1, 0, 0]
    limits: {lower: -180, upper: 180}
    link: {geometry: [{shape: capsule, radius: 0.02}]}
ee:
  name: ee_site
  origin: {xyz: [0.176944, 0, 0], rpy: [0, 0, 0]}   # t_M - p_6 = (0.536494 - 0.35955, 0, 0.42705 - 0.42705); R_M = I
payload: 0.75
repeatability: 0.001
reach: {value: 0.75, measured_from: shoulder, measured_to: ee_site}
drawing:
  - {measure: height, value: 0.42675, point: wrist_center, tolerance: 0.001}      # 126.75 + 300 mm
  - {measure: horizontal, value: 0.360, point: wrist_center, tolerance: 0.001}    # 60 + 300 mm
sources:
  joints[*].origin: https://raw.githubusercontent.com/TrossenRobotics/interbotix_xsarms_docs/main/docs/specifications/vx300s.rst
  joints[*].axis: https://raw.githubusercontent.com/TrossenRobotics/interbotix_xsarms_docs/main/docs/specifications/vx300s.rst
  joints[*].limits: https://raw.githubusercontent.com/TrossenRobotics/interbotix_xsarms_docs/main/docs/specifications/vx300s.rst
  joints[*].name: https://raw.githubusercontent.com/TrossenRobotics/interbotix_xsarms_docs/main/docs/_data/servos_vx300s.csv
  ee.origin: https://raw.githubusercontent.com/TrossenRobotics/interbotix_xsarms_docs/main/docs/specifications/vx300s.rst
  dof: https://raw.githubusercontent.com/TrossenRobotics/interbotix_xsarms_docs/main/docs/specifications/vx300s.rst
  payload: https://raw.githubusercontent.com/TrossenRobotics/interbotix_xsarms_docs/main/docs/specifications/vx300s.rst
  repeatability: https://raw.githubusercontent.com/TrossenRobotics/interbotix_xsarms_docs/main/docs/specifications/vx300s.rst
  reach.value: https://raw.githubusercontent.com/TrossenRobotics/interbotix_xsarms_docs/main/docs/specifications/vx300s.rst
  drawing: https://raw.githubusercontent.com/TrossenRobotics/interbotix_xsarms_docs/main/docs/specifications/images/vx300s_drawing.png
estimates:
  - base.link.geometry
  - joints[*].link.geometry
  - joints[2].limits
  - joints[4].limits
  - reach.measured_from
  - reach.measured_to
  - drawing[0]
  - drawing[1]
notes: >
  Kinematic source: published screw-axis (product-of-exponentials) table, space frame (M + Slist) on the
  manufacturer's spec page (Sphinx source vx300s.rst in TrossenRobotics/interbotix_xsarms_docs, primary;
  the rendered docs.trossenrobotics.com page was blocked). Converted exactly to the `offset` convention with
  the PoE home as q = 0 (upper arm vertical, forearm horizontal along +x), all frames parallel to the base
  frame. Points on axes p_i = w_i x v_i (m): J1 (0,0,0) +z; J2 (0,0,0.12705) +y; J3 (0.05955,0,0.42705) +y;
  J4 axis +x through z = 0.42705; J5 (0.35955,0,0.42705) +y; J6 axis +x through z = 0.42705. For the two roll
  axes (J4, J6) any point on the axis gives the identical model; J4 is placed at x = 0.05955 (at the elbow)
  and J6 at x = 0.35955 (at the wrist-angle axis) so the link frames sit on the arm. Axis signs copied from
  Slist. Tool: M = identity rotation at (0.536494, 0, 0.42705); the page does not name the physical frame M
  describes (it is 0.176944 m beyond the wrist-angle axis, more than the drawing's 70 mm to the gripper
  mount, so it is likely a gripper/ee frame, not the wrist-rotate flange). ee_site is placed at M as published.
  Units: PoE units are not printed; values are consistent with metres (drawing 300 mm links = 0.3), so the
  file uses m. Payload "750g" -> 0.75 kg and repeatability "1mm" -> 0.001 m are exact unit conversions.
  Joint limits: firmware "Default Joint Limits" table (deg from servo centre), mapped by joint NAME
  (the table lists Wrist Angle before Forearm Roll with swapped servo IDs vs the servo CSV; CSV gives the
  order). The page does not state the limit sign convention relative to the PoE screw axes; the symmetric
  limits are unaffected, the asymmetric elbow (-101..92) and wrist_angle (-107..130) are listed as estimates
  because their sign alignment with the PoE axes is assumed (firmware q = PoE q). No joint is continuous.
  Reach "750mm" (Total Span 1500mm) has no stated definition; shoulder -> ee_site is assumed (estimate); the
  built model gives about 0.783 m for that, so a reach warning is expected. Do not tune geometry to it.
  Drawing cross-check: drawing labels 126.75 (mounting face -> shoulder axis), 300 (shoulder -> elbow level),
  60 (shoulder line -> elbow axis), 300 (elbow -> wrist-angle axis); the extension-line mapping is the scout's
  visual reading and the sums are ours, so both drawing entries are estimates. PoE vs drawing differ by
  0.3 mm (shoulder height 127.05 vs 126.75) and 0.45 mm (59.55 vs 60); tolerance 1 mm. The base frame is
  assumed to be the mounting face (not stated by the PoE page). Link geometry radii are estimates: base and
  waist from the 84.5 mm turret face width in the drawing (r = 0.04225), arm links from the XM540-W270 case
  (33.5 x 58.5 x 44 mm), wrist from XM430-W350 (28.5 x 46.5 x 34 mm). Not published, omitted: total mass,
  link masses/inertias, joint velocity and torque limits (only servo stall torque / no-load speed exist;
  shoulder and elbow use two servos each).
