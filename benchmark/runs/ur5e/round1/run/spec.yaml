name: ur5e
manufacturer: Universal Robots
model: UR5e
description: UR5e collaborative robot arm (e-Series), arm only, EE site at the tool flange.
dof: 6
units: {length: mm, angle: deg}     # DH lengths published in m, written in mm (x1000); alpha pi/2 rad written as 90 deg
convention: dh_standard             # UR article: a_i, d_i, alpha_i per joint, theta_i = q_i
base:
  link:
    geometry: [{shape: cylinder, radius: 74.5}]
joints:
  - name: shoulder_pan
    dh: {a: 0, alpha: 90, d: 162.5}
    limits: {lower: -360, upper: 360}
    velocity_limit: 180
    effort_limit: 150
    link: {mass: 3.761, com: [0, -25.61, 1.93], geometry: [{shape: capsule, radius: 60}]}
  - name: shoulder_lift
    dh: {a: -425, alpha: 0, d: 0}
    limits: {lower: -360, upper: 360}
    velocity_limit: 180
    effort_limit: 150
    link: {mass: 8.058, com: [212.5, 0, 113.36], geometry: [{shape: capsule, radius: 50}]}
  - name: elbow
    dh: {a: -392.2, alpha: 0, d: 0}
    limits: {lower: -360, upper: 360}
    velocity_limit: 180
    effort_limit: 150
    link: {mass: 2.846, geometry: [{shape: capsule, radius: 40}]}
  - name: wrist_1
    dh: {a: 0, alpha: 90, d: 133.3}
    limits: {lower: -360, upper: 360}
    velocity_limit: 180
    effort_limit: 28
    link: {mass: 1.37, geometry: [{shape: capsule, radius: 35}]}
  - name: wrist_2
    dh: {a: 0, alpha: -90, d: 99.7}
    limits: {lower: -360, upper: 360}
    velocity_limit: 180
    effort_limit: 28
    link: {mass: 1.3, com: [0, 1.8, 16.34], geometry: [{shape: capsule, radius: 35}]}
  - name: wrist_3
    dh: {a: 0, alpha: 0, d: 99.6}
    limits: {lower: -360, upper: 360}
    velocity_limit: 180
    effort_limit: 28
    link: {mass: 0.365, geometry: [{shape: capsule, radius: 32}]}
ee: {name: ee_site}                 # frame 6 is the tool flange in UR's DH convention (d6 = 99.6 mm)
total_mass: 20.6
payload: 5
reach: {value: 850, measured_from: base_axis_horizontal, measured_to: ee_site}
repeatability: 0.03
sources:
  joints[*].dh: https://www.universal-robots.com/articles/ur/application-installation/dh-parameters-for-calculations-of-kinematics-and-dynamics/
  joints[*].link.mass: https://www.universal-robots.com/articles/ur/application-installation/dh-parameters-for-calculations-of-kinematics-and-dynamics/
  joints[*].link.com: https://www.universal-robots.com/articles/ur/application-installation/dh-parameters-for-calculations-of-kinematics-and-dynamics/
  joints[*].limits: https://www.universal-robots.com/manuals/EN/TechSheets/UR5e_techsheet_pdf_online/UR5e_techsheet_en.pdf
  joints[*].velocity_limit: https://www.universal-robots.com/manuals/EN/TechSheets/UR5e_techsheet_pdf_online/UR5e_techsheet_en.pdf
  joints[*].effort_limit: https://www.universal-robots.com/articles/ur/robot-care-maintenance/max-joint-torques-cb3-and-e-series/
  total_mass: https://www.universal-robots.com/media/1807465/ur5e_e-series_datasheets_web.pdf
  payload: https://www.universal-robots.com/media/1807465/ur5e_e-series_datasheets_web.pdf
  reach.value: https://www.universal-robots.com/media/1807465/ur5e_e-series_datasheets_web.pdf
  repeatability: https://www.universal-robots.com/manuals/EN/TechSheets/UR5e_techsheet_pdf_online/UR5e_techsheet_en.pdf
estimates:
  - joints[*].link.geometry
  - base.link.geometry
  - reach.measured_from
  - reach.measured_to
notes: >
  Kinematic source: published DH table (UR support article "DH parameters for calculations of
  kinematics and dynamics", primary; values taken from web-search extracts because direct fetch of
  universal-robots.com is blocked). Standard DH, theta_i = q_i (no offsets). Lengths published in metres are
  written in mm (exact x1000 unit change; d1 162.5, a2 425, a3 392.2, d5 99.7 match the mm labels of
  the datasheet drawing) so reach (850 mm) and repeatability (0.03 mm) stay verbatim; CoMs likewise
  converted m->mm; alpha copied from pi/2, 0, -pi/2 rad and written as 90, 0, -90 deg (angle unit deg for the whole file
  so the +-360 deg working ranges and 180 deg/s speeds stay verbatim). Frame 6 (d6 = 0.0996 m) is the
  tool flange, so ee.origin is zero. Link masses and the CoMs of links 1, 2 and 5 are from the same
  article (offsets in the DH frame of each link); CoMs of links 3, 4, 6 were not extracted and are
  omitted (builder uses the geometry centroid). Total mass 20.6 kg is the datasheet value incl. cable
  (user manual says 20.7 kg); the base gets the remainder (20.6 - 17.7 = 2.9 kg). Joint working ranges
  +-360 deg (techsheet). Effort limits: UR article on max joint torques maps UR5/UR5e base, shoulder,
  elbow to size 3 (150 Nm) and wrists 1-3 to size 1 (28 Nm) (search extract; a UR forum post agrees);
  UR notes these are the joint ratings, not usable application torques. Reach 850 mm: datasheet R850
  working-area radius; the manual describes a cylindrical working volume 850 mm from the base joint, so
  measured_from base_axis_horizontal and measured_to ee_site (flange) are my reading, listed as
  estimates. Geometry radii are estimates from product photos: base cylinder radius 74.5 mm from the
  datasheet O149 mm footprint (techsheet says O151); shoulder 60, upper arm 50, forearm 40,
  wrists 35, wrist 3 32 mm.
