name: franka_panda
manufacturer: Franka Emika
model: Panda (FER) arm, 7-DOF, without hand
description: Franka Emika Panda arm only (no hand); EE site at the flange (DH flange row, 0.107 m along z7).
dof: 7
units: {length: m, angle: deg}      # DH table is in m and rad; pi/2 rad written as 90 deg
convention: dh_modified             # "following Craig's convention"; row i = a_{i-1}, alpha_{i-1}, d_i, theta_i
joints:
  - name: A1
    dh: {a: 0, d: 0.333, alpha: 0}
    limits: {lower: -166, upper: 166}
    velocity_limit: 150
    effort_limit: 87
    link: {geometry: [{shape: capsule, radius: 0.06}]}
  - name: A2
    dh: {a: 0, d: 0, alpha: -90}
    limits: {lower: -101, upper: 101}
    velocity_limit: 150
    effort_limit: 87
    home: -45
    link: {geometry: [{shape: capsule, radius: 0.06}]}
  - name: A3
    dh: {a: 0, d: 0.316, alpha: 90}
    limits: {lower: -166, upper: 166}
    velocity_limit: 150
    effort_limit: 87
    link: {geometry: [{shape: capsule, radius: 0.055}]}
  - name: A4
    dh: {a: 0.0825, d: 0, alpha: 90}
    limits: {lower: -176, upper: -4}
    velocity_limit: 150
    effort_limit: 87
    home: -135
    link: {geometry: [{shape: capsule, radius: 0.055}]}
  - name: A5
    dh: {a: -0.0825, d: 0.384, alpha: -90}
    limits: {lower: -166, upper: 166}
    velocity_limit: 180
    effort_limit: 12
    link: {geometry: [{shape: capsule, radius: 0.05}]}
  - name: A6
    dh: {a: 0, d: 0, alpha: 90}
    limits: {lower: -1, upper: 215}
    velocity_limit: 180
    effort_limit: 12
    home: 90
    link: {geometry: [{shape: capsule, radius: 0.045}]}
  - name: A7
    dh: {a: 0.088, d: 0, alpha: 90}
    limits: {lower: -166, upper: 166}
    velocity_limit: 180
    effort_limit: 12
    home: 45
    link: {geometry: [{shape: cylinder, radius: 0.04}]}
ee:
  name: ee_site
  origin: {xyz: [0, 0, 0.107]}      # "Flange" row of the DH table: a = 0, d = 0.107 m, alpha = 0, theta = 0
total_mass: 17.8
payload: 3
repeatability: 0.1
reach: {value: 0.855, measured_from: shoulder, measured_to: ee_site}
sources:
  joints[*].dh: https://frankarobotics.github.io/docs/robot_specifications.html
  joints[6].dh.alpha: https://www.diag.uniroma1.it/~labrob/pub/papers/RAL_2019_PandaDynamicModel_PreprintXplore.pdf
  ee.origin: https://frankarobotics.github.io/docs/robot_specifications.html
  joints[*].limits: https://www.generationrobots.com/media/Panda_Datasheet_May_2019.pdf
  joints[*].velocity_limit: https://www.generationrobots.com/media/Panda_Datasheet_May_2019.pdf
  joints[*].effort_limit: https://frankarobotics.github.io/docs/robot_specifications.html
  total_mass: https://centers.ulbsibiu.ro/incon/wp-content/uploads/Datasheet-Franka-Emika-Panda-Research-collaborative-robot.pdf
  payload: https://www.generationrobots.com/media/Panda_Datasheet_May_2019.pdf
  repeatability: https://www.generationrobots.com/media/Panda_Datasheet_May_2019.pdf
  reach.value: https://www.generationrobots.com/media/Panda_Datasheet_May_2019.pdf
estimates:
  - joints[*].home
  - joints[*].link.geometry
  - reach.measured_from
  - reach.measured_to
notes: >
  Kinematic source: published DH table (Franka Control Interface docs, modified/Craig DH, primary; same table in the
  Gaz et al. RA-L 2019 Panda identification paper, which supplies the joint-7 row alpha = pi/2). All values via
  web-search extracts (frankaemika/frankarobotics docs could not be fetched directly). The current FCI page labels the
  table for FR3; the older control_parameters page and the Gaz paper give the same table for the Panda.
  Rows copied verbatim, theta_i = q_i, alpha in deg (pi/2 -> 90). The table's "Flange" row (a = 0, d = 0.107 m) is not
  a joint and is ee.origin; the EE site is at the flange face, arm only (no hand).
  Joint ranges in deg from the Panda datasheet (May 2019; reseller-hosted copy of the Franka document, second-hand
  host): A1/A3/A5/A7 +-166, A2 +-101, A4 -176..-4, A6 -1..215 (these are the mechanical/working ranges of the arm).
  Speeds: datasheet 150 deg/s (A1-A4) and 180 deg/s (A5-A7; seen in one datasheet version only). The FCI gives lower
  controller limits (2.1750 rad/s for A1-A4, 2.6100 rad/s for A5-A7); the datasheet values were used.
  Torques 87 Nm (A1-A4) and 12 Nm (A5-A7) from the FCI limits table. Total mass 17.8 kg ("~17.8 kg") from a
  university-hosted copy of the datasheet (second-hand host); the handbook says "approx. 18 kg". Link masses are not
  published, so the builder distributes total_mass by volume.
  Home: q = 0 is outside the A4 range (-176..-4), so home is the commonly used Franka "ready" configuration
  [0, -45, 0, -135, 0, 90, 45] deg (an estimate, quoted from memory of Franka example code, not from a fetched source;
  only used as the rest pose).
  Reach: datasheet "Maximum reach 855 mm" with no reference points; I assume shoulder (A2 axis) to flange, the usual
  datasheet meaning: shoulder-to-elbow sqrt(0.316^2+0.0825^2) + elbow-to-wrist sqrt(0.384^2+0.0825^2) + wrist-to-flange
  sqrt(0.088^2+0.107^2) is about 0.858 m. Both endpoints are estimates.
  Geometry radii (0.06/0.06/0.055/0.055/0.05/0.045 m capsules, 0.04 m flange cylinder) estimated from product photos;
  no housing dimensions were found. Base geometry is the builder default.
