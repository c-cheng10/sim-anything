name: kinova_gen3
manufacturer: Kinova
model: Gen3 ultra lightweight robot, 7-DOF spherical wrist (no gripper)
description: Kinova Gen3 7-DOF arm, spherical wrist, arm only, EE site at the tool interface (DH frame 7).
dof: 7
units: {length: m, angle: deg}       # table lengths are in metres; pi/2 and pi written as 90 / 180 deg
convention: dh_standard              # classic DH, T = Rz(theta) Tz(d) Tx(a) Rx(alpha)
base:
  origin: {rpy: [180, 0, 0]}         # table row "0 (base)": alpha = pi, a = 0, d = 0 (base -> frame 0)
joints:
  - {name: joint_1, dh: {a: 0, alpha: 90, d: -0.2848, theta_offset: 0},
     velocity_limit: 78, effort_limit: 54,
     link: {geometry: [{shape: capsule, radius: 0.045}]}}
  - {name: joint_2, dh: {a: 0, alpha: 90, d: -0.0118, theta_offset: 180},
     limits: {lower: -128.9, upper: 128.9}, velocity_limit: 78, effort_limit: 54,
     link: {geometry: [{shape: capsule, radius: 0.045}]}}
  - {name: joint_3, dh: {a: 0, alpha: 90, d: -0.4208, theta_offset: 180},
     velocity_limit: 78, effort_limit: 54,
     link: {geometry: [{shape: capsule, radius: 0.045}]}}
  - {name: joint_4, dh: {a: 0, alpha: 90, d: -0.0128, theta_offset: 180},
     limits: {lower: -147.8, upper: 147.8}, velocity_limit: 78, effort_limit: 54,
     link: {geometry: [{shape: capsule, radius: 0.045}]}}
  - {name: joint_5, dh: {a: 0, alpha: 90, d: -0.3143, theta_offset: 180},
     velocity_limit: 150, effort_limit: 34,
     link: {geometry: [{shape: capsule, radius: 0.035}]}}
  - {name: joint_6, dh: {a: 0, alpha: 90, d: 0, theta_offset: 180},
     limits: {lower: -120.3, upper: 120.3}, velocity_limit: 150, effort_limit: 34,
     link: {geometry: [{shape: capsule, radius: 0.035}]}}
  - {name: joint_7, dh: {a: 0, alpha: 180, d: -0.1674, theta_offset: 180},
     velocity_limit: 150, effort_limit: 34,
     link: {geometry: [{shape: capsule, radius: 0.035}]}}
ee: {name: ee_site}                  # frame 7 already includes "last actuator to end effector 61.5 mm"
total_mass: 8.2
payload: 4.0
reach: {value: 0.902, measured_from: shoulder, measured_to: ee_site}
sources:
  base.origin: https://github.com/Sahilnarola-1007/kinova-kinematics/blob/main/design.md
  joints[*].dh: https://github.com/Sahilnarola-1007/kinova-kinematics/blob/main/design.md
  joints[*].limits: https://www.kinovarobotics.com/uploads/User-Guide-Gen3-R07.pdf
  joints[*].velocity_limit: https://www.kinovarobotics.com/uploads/User-Guide-Gen3-R07.pdf
  joints[*].effort_limit: https://www.kinovarobotics.com/uploads/User-Guide-Gen3-R07.pdf
  total_mass: https://www.kinovarobotics.com/product/gen3-robots
  payload: https://www.kinovarobotics.com/uploads/Kinova_Onepager_Gen3_2024_EN.pdf
  reach: https://www.kinovarobotics.com/uploads/User-Guide-Gen3-R07.pdf
estimates:
  - joints[*].link.geometry
notes: >
  DH table (classic DH; base row alpha=pi; rows 1-6 alpha=pi/2; row 7 alpha=pi; theta_i = q_i + pi for i=2..7)
  is quoted from a secondary source (the design notes of an FK library, which attribute it to the Kinova Gen3
  7-DOF kinematic parameters / User Guide without a table reference); the official guide's DH table (p.197 of
  R07) could not be fetched. Every d value is cross-checked against the User Guide Table 9 geometric
  parameters: 284.8 = base to shoulder, 11.8 = 5.4 + 6.4 joint offsets, 420.8 = 210.4 + 210.4 upper arm halves,
  314.3 = 208.4 + 105.9 forearm + first wrist length, 167.4 = 105.9 + 61.5 second wrist length + last actuator
  to end effector. 12.8 is the only d value not directly checkable from the extracted Table 9 (it would be
  6.4 + 6.4).
  Joints 1, 3, 5, 7 are continuous (guide: "no limit"), so their limits are omitted. Limits of joints 2/4/6
  are the newer R07 software limits (older guide: 126/147/117).
  velocity_limit is the guide's max unloaded speed converted exactly: 13 RPM = 78 deg/s (large actuators,
  joints 1-4), 25 RPM = 150 deg/s (small actuators, joints 5-7); actuator-to-joint mapping from the spec sheet.
  effort_limit is the guide's peak torque (large 54 N*m, small 34 N*m); nominal is 39 / 13 N*m.
  total_mass 8.2 kg from the product page (guide: 8.3 kg with vision module). payload 4.0 kg is mid-range
  continuous (2.0 kg full-range continuous, 4.5 kg peak). Reach 902 mm is measured from the shoulder
  (actuator 2 frame) to the end-effector frame.
  Link capsule radii are rough estimates (no housing diameters found): 45 mm for links driven by the large
  actuators, 35 mm for the small-actuator links, chosen as plausible for an arm whose wrist segments are
  105.9 mm long; not measured from any drawing.
