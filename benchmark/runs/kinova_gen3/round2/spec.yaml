name: kinova_gen3
manufacturer: Kinova
model: Gen3 ultra lightweight robot, 7-DOF spherical wrist, no gripper
description: Kinova Gen3 7-DOF arm without gripper; q = 0 is the straight-up configuration; EE site at the end-effector (tool interface) frame, 61.5 mm past actuator 7.
dof: 7
units: {length: mm, angle: deg}
convention: offset                  # built from the user guide's geometric-parameter lengths (no DH values extracted)
joints:
  - name: actuator_1                # base yaw, continuous
    origin: {xyz: [0, 0, 156.4]}    # "Base to actuator 1 156.4"
    axis: [0, 0, 1]
    velocity_limit: 78
    effort_limit: 54
    link: {geometry: [{shape: capsule, radius: 50}]}
  - name: actuator_2                # shoulder bend
    origin: {xyz: [0, 0, 128.4]}    # 284.8 (base to shoulder) - 156.4
    axis: [0, 1, 0]
    limits: {lower: -128.9, upper: 128.9}
    velocity_limit: 78
    effort_limit: 54
    link: {geometry: [{shape: capsule, radius: 45}]}
  - name: actuator_3                # upper-arm roll, continuous
    origin: {xyz: [0, 0, 210.4]}    # "First half upper arm length 210.4"
    axis: [0, 0, 1]
    velocity_limit: 78
    effort_limit: 54
    link: {geometry: [{shape: capsule, radius: 45}]}
  - name: actuator_4                # elbow bend
    origin: {xyz: [0, 0, 210.4]}    # "Second half upper arm length 210.4"
    axis: [0, 1, 0]
    limits: {lower: -147.8, upper: 147.8}
    velocity_limit: 78
    effort_limit: 54
    link: {geometry: [{shape: capsule, radius: 40}]}
  - name: actuator_5                # forearm roll, continuous
    origin: {xyz: [0, 0, 208.4]}    # "Forearm length (elbow to wrist) 208.4"
    axis: [0, 0, 1]
    velocity_limit: 150
    effort_limit: 34
    link: {geometry: [{shape: capsule, radius: 35}]}
  - name: actuator_6                # wrist bend
    origin: {xyz: [0, 0, 105.9]}    # "First wrist length 105.9"
    axis: [0, 1, 0]
    limits: {lower: -120.3, upper: 120.3}
    velocity_limit: 150
    effort_limit: 34
    link: {geometry: [{shape: capsule, radius: 35}]}
  - name: actuator_7                # wrist roll, continuous
    origin: {xyz: [0, 0, 105.9]}    # "Second wrist length 105.9"
    axis: [0, 0, 1]
    velocity_limit: 150
    effort_limit: 34
    link: {geometry: [{shape: cylinder, radius: 35}]}
ee:
  name: ee_site
  origin: {xyz: [0, 0, 61.5]}       # "Last actuator to end efector 61.5"
total_mass: 8.2
payload: 4.0
reach: {value: 902, measured_from: shoulder, measured_to: ee_site}
sources:
  joints[1].limits: https://www.kinovarobotics.com/uploads/User-Guide-Gen3-R07.pdf
  joints[3].limits: https://www.kinovarobotics.com/uploads/User-Guide-Gen3-R07.pdf
  joints[5].limits: https://www.kinovarobotics.com/uploads/User-Guide-Gen3-R07.pdf
  joints[*].velocity_limit: https://www.kinovarobotics.com/uploads/User-Guide-Gen3-R07.pdf
  joints[*].effort_limit: https://www.kinovarobotics.com/uploads/User-Guide-Gen3-R07.pdf
  total_mass: https://www.kinovarobotics.com/product/gen3-robots
  payload: https://www.kinovarobotics.com/uploads/Kinova_Onepager_Gen3_2024_EN.pdf
  reach: https://www.kinovarobotics.com/uploads/User-Guide-Gen3-R07.pdf
estimates:
  - joints[*].origin
  - joints[*].axis
  - ee.origin
  - joints[*].link.geometry
notes: >
  Kinematic source: dimension table (Gen3 user guide "Table 9: 7 DoF spherical wrist robot geometric parameters",
  lengths in mm), mapped to joints by me, so the chain is class 3 (drawing/dimension table) with every origin and axis
  listed as an estimate. The guide also has a "Denavit-Hartenberg (DH) parameters - 7 DoF spherical wrist" table, but
  its values could not be extracted (direct fetches of kinovarobotics.com, manualshive.com and arxiv.org fail in this
  environment; searches only returned the table of contents). The geometric lengths came from a Scribd/manualslib copy
  of the guide (second-hand host of the manufacturer document).
  Mapping (estimate): q = 0 is the arm pointing straight up, inferred from the length table (stacked base-to-actuator
  heights) and from joints 2/4/6 having limits symmetric about 0; joints 1/3/5/7 (continuous) roll about the arm's
  long axis (z), joints 2/4/6 bend about base y; all frames parallel to the base. Joint origins along z: actuator 1 at
  156.4, actuator 2 at 284.8 (base to shoulder, so 128.4 after actuator 1), then 210.4, 210.4, 208.4, 105.9, 105.9,
  and the EE site 61.5 past actuator 7 ("Last actuator to end efector"). Where the roll joints sit along their own axis
  does not change the kinematics. The two small lateral joint offsets in the table (5.4 mm and 6.4 mm) could not be
  assigned to joints from the extract, so they are omitted (the arm is modelled as perfectly in-line); this is the
  main known kinematic error (about 1 cm lateral). Bending-joint signs (+y for 2, 4, 6) are guesses; the roll/bend
  layout matches product photos, but a mirrored sign is possible.
  EE site: the arm has no flange separate from the end-effector interface on actuator 7; I put the site at the guide's
  "end effector" point, 61.5 mm beyond actuator 7 along the last axis (the tool interface face, no gripper).
  Joint limits: newer guide (R07) Table 35, actuator 2 +-128.9, actuator 4 +-147.8, actuator 6 +-120.3 deg (software
  limits; older guide: +-126/+-147/+-117); actuators 1/3/5/7 have "no limit", so their limits are omitted.
  Speeds: guide R07 "maximum unloaded speed is 25 RPM (small) and 13 RPM (large)", converted exactly
  (13 RPM = 78 deg/s, 25 RPM = 150 deg/s); torques: peak 54 Nm (large) and 34 Nm (small) from the same guide (nominal
  39/13 Nm). Large actuators drive joints 1-4 and small ones joints 5-7 per the Gen3 specifications sheet (reseller
  copy, https://hotrobotics.co.uk/wp-content/uploads/2021/07/Gen3-Specifications-R01.pdf, second-hand host).
  Mass 8.2 kg (product page, 7-DoF; guide says 8.3 kg with vision module, no gripper). Payload 4.0 kg = mid-range
  continuous (2.0 kg full-range continuous, 4.5 kg peak). Reach 902 mm "from the shoulder (Actuator 2 frame) to the end
  effector frame" (guide); the length sum 420.8 + 208.4 + 211.8 + 61.5 = 902.5 mm agrees. Repeatability not found.
  Link radii (50/45/45/40/35/35 mm capsules, 35 mm end cylinder) estimated from product photos; no housing diameters
  were found. Link masses not published (builder distributes 8.2 kg by volume).
