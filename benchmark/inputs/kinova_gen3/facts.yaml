# Structured facts for the Kinova Gen3, 7-DOF spherical wrist, no gripper.
# All values came from web-search extracts of the cited pages (direct fetch blocked); see sources.md.
robot: kinova_gen3
name: Kinova Gen3 (7-DOF)
manufacturer: Kinova
accessed: "2026-11-05"
publishes_dh: true   # the user guide has a "DH parameters - 7 DoF spherical wrist" table; its values were NOT extracted

sources:
  user_guide: https://www.kinovarobotics.com/uploads/User-Guide-Gen3-R07.pdf
  user_guide_geom: https://www.manualslib.com/manual/1529186/Kinova-Gen3.html?page=49
  user_guide_copy: https://www.scribd.com/document/624143328/gen3
  spec_sheet: https://hotrobotics.co.uk/wp-content/uploads/2021/07/Gen3-Specifications-R01.pdf
  product_page: https://www.kinovarobotics.com/product/gen3-robots
  onepager: https://www.kinovarobotics.com/uploads/Kinova_Onepager_Gen3_2024_EN.pdf

dof: {value: 7, source: product_page}

kinematics:
  convention: unknown        # guide publishes a DH table; its convention and values were not extracted
  dh_table: not extracted - read "Denavit-Hartenberg (DH) parameters - 7 DoF spherical wrist" in user_guide (p.197 in R07)
  geometric_parameters_mm:   # "Table 9: 7 DoF spherical wrist robot geometric parameters", Length (mm)
    source: user_guide_geom
    base_to_actuator_1: 156.4
    base_to_shoulder: 284.8          # = base to actuator 2 axis
    first_half_upper_arm: 210.4      # actuator 2 -> actuator 3
    second_half_upper_arm: 210.4     # actuator 3 -> actuator 4
    forearm_elbow_to_wrist: 208.4    # actuator 4 -> actuator 5 (as labelled "elbow to wrist")
    first_wrist_length: 105.9        # actuator 5 -> actuator 6
    second_wrist_length: 105.9       # actuator 6 -> actuator 7
    last_actuator_to_end_effector: 61.5
    joint_offsets: [5.4, 6.4]        # lateral offsets; which joints not in the extract
  joint_axes: "not stated in the extracts. Inference only (not a source): continuous actuators 1,3,5,7 are the roll joints along the arm, 2,4,6 the limited bending joints"

joints:
  - {name: actuator_1, range_deg: null, continuous: true,  actuator: large}
  - {name: actuator_2, range_deg: [-128.9, 128.9], continuous: false, actuator: large}
  - {name: actuator_3, range_deg: null, continuous: true,  actuator: large}
  - {name: actuator_4, range_deg: [-147.8, 147.8], continuous: false, actuator: large}
  - {name: actuator_5, range_deg: null, continuous: true,  actuator: small}
  - {name: actuator_6, range_deg: [-120.3, 120.3], continuous: false, actuator: small}
  - {name: actuator_7, range_deg: null, continuous: true,  actuator: small}
joint_limits_source: user_guide   # newer manual Table 35; older manual Table 10: ±126 / ±147 / ±117
actuator_mapping_source: spec_sheet
actuators:
  source: user_guide
  large: {max_speed_rpm: 13, torque_nominal_nm: 39, torque_peak_nm: 54, note: "nominal 32 Nm before 2022-09; older manual 17 RPM, 74 Nm peak"}
  small: {max_speed_rpm: 25, torque_nominal_nm: 13, torque_peak_nm: 34}

total_mass: {value: 8.2, unit: kg, note: "product page 8.2 kg; guide 8.3 kg with vision module, no gripper", source: product_page}
payload: {value: 4.0, unit: kg, note: "mid-range continuous; 2.0 kg full-range continuous; 4.5 kg peak", source: onepager}
reach: {value: 902, unit: mm, definition: "from the shoulder (actuator 2 frame) to the end-effector frame", source: user_guide}
max_cartesian_speed: {value: 0.5, unit: m/s, source: onepager}

conflicts:
  - "joint limits: ±128.9/±147.8/±120.3 (newer guide) vs ±126/±147/±117 (older guide)"
  - "large actuator speed 13 RPM (R07) vs 17 RPM (older); peak torque 54 vs 74 Nm"
  - "mass 8.2 kg vs 8.3 kg"

not_found:
  - the DH table values (exists in user_guide; not extractable through search)
  - which joints carry the 5.4 mm and 6.4 mm offsets, and their directions
  - repeatability (not found in extracts)
  - link masses / CoMs (guide has a "Dynamic parameters of the 7 DoF robot" section, manualslib page 137; not extracted)
  - housing diameters
